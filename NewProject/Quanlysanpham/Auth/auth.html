<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            border: none;
            background: transparent;
        }
        .login-title {
            font-size: 2.25rem;
            font-weight: 700;
            color: #111827;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #111827;
            margin-bottom: 0.4rem;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background-color: #ffffff;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-check-input {
            width: 1.1em;
            height: 1.1em;
            border-radius: 4px;
            border-color: #d1d5db;
        }
        .form-check-label {
            font-size: 0.875rem;
            color: #4b5563;
        }
        .forgot-password {
            font-size: 0.875rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .btn-login {
            background-color: #2563eb;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
        }
        .btn-login:hover {
            background-color: #1d4ed8;
        }
        .register-text {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-top: 1.5rem;
        }
        .register-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link:hover {
            text-decoration: underline;
        }
        
        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="login-title">Đăng nhập</h1>
        <p class="login-subtitle">Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="">
                <small id="emailError" class="error-msg">Email không được để trống</small>
            </div>

           
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" placeholder="">
                <small id="passwordError" class="error-msg">Mật khẩu không được để trống</small>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Nhớ tài khoản
                    </label>
                </div>
                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login">Đăng nhập</button>
        </form>

        <div class="register-text">
            Bạn chưa có tài khoản? <a href="register.html" class="register-link">Đăng ký</a>
        </div>
    </div>

    <script src="../data.js"></script>
    <script src="./auth.js"></script>
</body>
</html>
