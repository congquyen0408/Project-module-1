<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border: none;
            background: transparent;
        }

        .register-title {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .register-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #111827;
            margin-bottom: 0.4rem;
        }

        .form-control {
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background-color: #ffffff;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .form-check-input {
            width: 1.1em;
            height: 1.1em;
            border-radius: 4px;
            border-color: #d1d5db;
        }

        .form-check-label {
            font-size: 0.85rem;
            color: #4b5563;
        }

        .btn-register {
            background-color: #007bff;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
        }

        .btn-register:hover {
            background-color: #0056b3;
        }

        .login-text {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-link {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.825rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <h1 class="register-title">Đăng ký tài khoản</h1>
        <p class="register-subtitle">Đăng ký tài khoản để sử dụng dịch vụ</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm" novalidate>
            <div class="row g-2 mb-3">
                <div class="col-7">
                    <label for="lastName" class="form-label">Họ và tên đệm</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" placeholder="">
                    <small id="lastNameError" class="error-msg">Không được để trống</small>
                </div>
                <div class="col-5">
                    <label for="firstName" class="form-label">Tên</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="">
                    <small id="firstNameError" class="error-msg">Không được để trống</small>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com">
                <small id="emailError" class="error-msg">Email không được để trống</small>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="">
                <small id="passwordError" class="error-msg">Mật khẩu không được để trống</small>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="">
                <small id="confirmPasswordError" class="error-msg">Xác nhận mật khẩu không được để trống</small>
            </div>

            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" id="agreeCheck" name="agreeCheck">
                <label class="form-check-label" for="agreeCheck">
                    Bạn đồng ý với <a href="#" class="text-primary text-decoration-none">chính sách và điều khoản</a>
                </label>
                <div>
                    <small id="agreeError" class="error-msg">Bạn phải đồng ý với chính sách và điều khoản</small>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-register">Đăng ký</button>
        </form>

        <div class="login-text">
            Bạn đã có tài khoản? <a href="auth.html" class="login-link">Đăng nhập</a>
        </div>
    </div>

    <script src="../data.js"></script>
    <script src="./register.js"></script>
</body>

</html>
